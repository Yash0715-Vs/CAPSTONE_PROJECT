<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssetDesk — Smart IT Asset & Ticket Management System</title>
  <meta name="description" content="Centralized enterprise operations platform to manage hardware assets, employee accounts, priority support queues, and SLA compliance.">
  
  <!-- Google Fonts: Newsreader (Editorial Serif), Inter (Sans), JetBrains Mono (Code/Badges) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <!-- Theme loader: restores saved theme before rendering to eliminate flash -->
  <script>
    (function() {
      try {
        const saved = localStorage.getItem("apex_theme") || "light";
        document.documentElement.setAttribute("data-theme", saved);
        if (saved === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    })();
  </script>
  <!-- Tailwind CSS CDN for Executive Stitch Dashboard -->
  <script src="https://cdn.tailwindcss.com"></script>

              "error-container": "#ffdad6",

              "on-primary-container": "#fffbff",

              "primary-container": "#b95837",
              "surface-container-highest": "#e3e2df",

              "surface-container-lowest": "#ffffff",
              "outline-variant": "#dcc1b8",
              "surface-variant": "#e3e2df",
