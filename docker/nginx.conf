# =====================================================================
# Nginx Reverse Proxy Configuration for IT Asset Management Dashboard
# Proxies API and WebSocket requests to FastAPI backend container
# =====================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream backend_api {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Static Frontend single-page application
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Static CSS and JS assets
        location /css/ {
            root /usr/share/nginx/html;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        location /js/ {
            root /usr/share/nginx/html;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # REST API Routes -> FastAPI Backend
        location ~ ^/(auth|users|assets|tickets|reports|health|docs|redoc|openapi.json) {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # Real-Time WebSocket Endpoint -> FastAPI Backend
        location /ws/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
